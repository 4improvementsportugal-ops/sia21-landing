<!DOCTYPE html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sistema IA do Consultor</title></head>
<body>
<script>
(async()=>{
  const b64="LOADING";
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const ds=new DecompressionStream("gzip");
  const ab=await new Response(new Blob([bin]).stream().pipeThrough(ds)).arrayBuffer();
  const html=new TextDecoder().decode(ab);
  document.open(); document.write(html); document.close();
})().catch(e=>{document.body.textContent="Recarrega a página."; console.error(e);});
</script>
</body></html>
